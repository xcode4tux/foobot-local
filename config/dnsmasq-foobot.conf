# dnsmasq-foobot.conf -- resolve the Foobot's broker to YOUR local host.
#
# This is the DNS side of the WSDNS trick (see README). Your host becomes a DNS
# resolver that rewrites ONLY the Foobot broker hostname to itself, and forwards
# everything else upstream. The Foobot points its WSDNS at this host.
#
# Install:  copy to /etc/dnsmasq.d/foobot.conf, then: systemctl restart dnsmasq
#
# Replace 192.168.1.50 with the LAN IP of THIS host in the two places below.

# Listen on loopback + this host's LAN IP. No dhcp-range -> DNS only.
listen-address=127.0.0.1,192.168.1.50
bind-interfaces

# The one rewrite that matters: the Foobot's MQTT broker -> this host.
address=/broker-gw-nc.foobot.io/192.168.1.50

# Everything else is forwarded upstream. Keep api.foobot.io resolving normally
# (the optional cloud fallback and the native Home Assistant Foobot integration
# still use it). Point these at your router and/or a public resolver.
no-resolv
server=192.168.1.254
server=9.9.9.9

# Comfort / robustness
cache-size=1000
domain-needed
bogus-priv
# log-queries    # uncomment to debug (verbose): shows every lookup the Foobot makes

# NOTE: for the Foobot to use this resolver you set AT+WSDNS=<this host> on the
# device (foobot_at.py --to-local). You do NOT need to make this the DNS of your
# whole LAN -- WSDNS scopes it to the Foobot only.
